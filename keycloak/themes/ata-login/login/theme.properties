# Aged Ticket Advisor - Keycloak login theme
#
# Deliberately a CSS and message overlay, not a fork. login.ftl, template.ftl
# and the rest of the markup come from the parent theme, so every Keycloak
# security fix to those files arrives with the next upgrade instead of having
# to be reapplied by hand. The cost is that this theme can only restyle and
# reword what the parent renders - which turns out to be enough.
#
# Applied per client (Clients > ata-web > Settings > Login theme), never
# realm-wide: the AIOT realm is shared, and a realm-wide theme would re-skin
# every other application's login page too.

parent=keycloak
import=common/keycloak

# `styles` REPLACES the inherited value rather than appending to it, so the
# parent's css/login.css has to be named again here. Dropping it would strip
# PatternFly entirely and leave an unstyled form.
#
# Our file is NOT called login.css on purpose: Keycloak resolves resources
# child-first, so a file of that name would shadow the parent's instead of
# layering over it.
#
# If the page renders unstyled after an upgrade, the parent's list has gained
# an entry. Check it with:
#   unzip -p /opt/keycloak/lib/lib/main/org.keycloak.keycloak-themes-*.jar \
#     theme/keycloak/login/theme.properties | grep '^styles'
styles=css/login.css css/ata.css

# Nothing else is overridden. Locale support, scripts and the PatternFly
# common styles are all inherited.
