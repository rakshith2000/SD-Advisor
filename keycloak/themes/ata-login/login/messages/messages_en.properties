# Aged Ticket Advisor - login wording
#
# Overrides only. Every key not listed here falls through to the parent theme,
# so a Keycloak upgrade that adds new screens still renders in English rather
# than showing raw message keys.
#
# Keycloak reads this file as ISO-8859-1, so anything outside ASCII must be a
# \uXXXX escape - a literal character renders as mojibake. This file is kept
# pure ASCII for that reason; the check in README.md verifies it.

# ---------------------------------------------------------------------------
# Branding
# ---------------------------------------------------------------------------
# loginTitleHtml is rendered into #kc-header-wrapper by the parent template,
# which is why the brand is real markup rather than a CSS content property -
# generated content is skipped by screen readers and cannot be translated.
#
# It passes through kcSanitize, so only a safe subset of HTML survives; span
# with a class does, which is all this needs.
#
# The realm display name ("AIOT") is deliberately not shown. The realm is
# shared with other applications and means nothing to a service desk lead.

loginTitleHtml=<span class="ata-brand">Aged Ticket Advisor</span><span class="ata-sub">Service desk aged pending ticket review</span>
loginTitle=Sign in \u00b7 Aged Ticket Advisor

# ---------------------------------------------------------------------------
# The sign-in form
# ---------------------------------------------------------------------------

loginAccountTitle=Sign in to continue
doLogIn=Sign in
doCancel=Cancel
doSubmit=Continue
doBack=Back

usernameOrEmail=Kohler username or email
username=Kohler username
password=Password
rememberMe=Keep me signed in on this device

doForgotPassword=Forgotten your password?
# Single sign-on is the expected route, so the heading above the identity
# provider buttons should not read like a fallback.
identity-provider-login-label=Continue with

# ---------------------------------------------------------------------------
# Errors
# ---------------------------------------------------------------------------
# Kept deliberately identical whether the account exists or not. A message
# that distinguishes "no such user" from "wrong password" turns the login form
# into a way of enumerating who works here.

invalidUserMessage=Incorrect username or password.
invalidUsernameOrEmailMessage=Incorrect username or password.
invalidPasswordMessage=Incorrect username or password.
missingUsernameMessage=Enter your username.
missingPasswordMessage=Enter your password.

accountDisabledMessage=This account has been disabled. Contact the service desk.
accountTemporarilyDisabledMessage=Too many failed attempts. Try again shortly, or contact the service desk.

expiredCodeMessage=That sign-in took too long and has expired. Please sign in again.
expiredActionMessage=That link has expired. Please sign in again.
# Reached when a stale callback arrives - a bookmarked /oidc/callback, or the
# back button after signing in. Says what to do rather than naming the fault.
pageExpiredMsg=This page is no longer valid. <a id="loginRestartLink" href="{0}">Start again</a>.

# ---------------------------------------------------------------------------
# After sign-out
# ---------------------------------------------------------------------------

backToApplication=Back to the Aged Ticket Advisor
logoutConfirmTitle=Sign out
logoutConfirmHeader=Sign out of the Aged Ticket Advisor?
doLogout=Sign out

# ---------------------------------------------------------------------------
# Access denied
# ---------------------------------------------------------------------------
# Keycloak renders this when consent is refused or the client rejects the
# login. Provisioning is handled inside the advisor, not here, so this points
# at the right place rather than implying Keycloak is the thing to fix.

accessDeniedMsg=You are signed in, but were not allowed to continue to the Aged Ticket Advisor. If you believe this is wrong, contact an Aged Ticket Advisor administrator.
errorTitle=Something went wrong
