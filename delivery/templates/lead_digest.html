{#
  Lead digest email.

  Email clients strip <style> unpredictably and Outlook has no flexbox or grid,
  so this is table-based with inline styles throughout. Light surface only -
  an auto-inverted dark mode in email is unreliable, so the surfaces are
  stated explicitly rather than left to the client.

  Colour follows the documented status palette. Every severity colour is
  paired with a written label, so nothing is carried by hue alone.
#}
{%- set INK = '#0b0b0b' -%}
{%- set INK2 = '#52514e' -%}
{%- set MUTED = '#898781' -%}
{%- set SURFACE = '#fcfcfb' -%}
{%- set PLANE = '#f9f9f7' -%}
{%- set RULE = '#e1e0d9' -%}
{%- set BORDER = '#c3c2b7' -%}
{%- set CRITICAL = '#d03b3b' -%}
{%- set SERIOUS = '#ec835a' -%}
{%- set WARNING = '#fab219' -%}
{%- set GOOD = '#0ca30c' -%}
{%- set ACCENT = '#2a78d6' -%}
{%- set FONT = "system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" -%}

{%- macro severity_color(sev) -%}
{%- if sev == 'critical' -%}{{ CRITICAL }}
{%- elif sev == 'high' -%}{{ SERIOUS }}
{%- elif sev == 'medium' -%}{{ WARNING }}
{%- else -%}{{ GOOD }}{%- endif -%}
{%- endmacro -%}

{%- macro severity_label(sev) -%}
{%- if sev == 'critical' -%}Critical
{%- elif sev == 'high' -%}High
{%- elif sev == 'medium' -%}Medium
{%- else -%}Low{%- endif -%}
{%- endmacro -%}

{%- macro stat_tile(label, value, note, color) -%}
<td width="25%" valign="top" style="padding:0 6px 12px 0;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
         style="background:{{ SURFACE }};border:1px solid {{ RULE }};border-radius:6px;">
    <tr><td style="padding:12px 14px;">
      <div style="font:400 12px/1.3 {{ FONT }};color:{{ INK2 }};">{{ label }}</div>
      <div style="font:600 26px/1.25 {{ FONT }};color:{{ color or INK }};padding-top:2px;">{{ value }}</div>
      {% if note %}<div style="font:400 11px/1.35 {{ FONT }};color:{{ MUTED }};padding-top:2px;">{{ note }}</div>{% endif %}
    </td></tr>
  </table>
</td>
{%- endmacro -%}

{%- macro ticket_row(row, reasons) -%}
<tr>
  <td style="padding:10px 8px;border-bottom:1px solid {{ RULE }};vertical-align:top;white-space:nowrap;">
    <table role="presentation" cellpadding="0" cellspacing="0"><tr>
      <td style="padding-right:6px;">
        <div style="width:8px;height:8px;border-radius:2px;background:{{ severity_color(row.severity) }};"></div>
      </td>
      <td style="font:600 13px/1.3 {{ FONT }};color:{{ INK }};font-variant-numeric:tabular-nums;">
        {% if row.url %}<a href="{{ row.url }}" style="color:{{ ACCENT }};text-decoration:none;">{{ row.incident_number }}</a>
        {% else %}{{ row.incident_number }}{% endif %}
      </td>
    </tr></table>
    <div style="font:400 11px/1.4 {{ FONT }};color:{{ MUTED }};padding-top:3px;">
      {{ severity_label(row.severity) }} &middot; score {{ row.attention_score }}
    </div>
  </td>

  <td style="padding:10px 8px;border-bottom:1px solid {{ RULE }};vertical-align:top;">
    <div style="font:400 13px/1.4 {{ FONT }};color:{{ INK }};">
      {{ (row.short_description or '(no description)')|truncate(78, true, '...') }}
    </div>
    <div style="font:400 11px/1.4 {{ FONT }};color:{{ MUTED }};padding-top:3px;">
      {{ row.assigned_to or 'Unassigned' }}
      {%- if row.caller_name %} &middot; caller {{ row.caller_name }}{% endif %}
    </div>
    {% if row.flag_labels %}
    <div style="padding-top:5px;">
      {% for flag in row.flag_labels[:4] %}
      <span style="display:inline-block;font:400 10px/1.5 {{ FONT }};color:{{ INK2 }};
                   background:{{ PLANE }};border:1px solid {{ RULE }};border-radius:3px;
                   padding:1px 6px;margin:0 4px 3px 0;">{{ flag }}</span>
      {% endfor %}
    </div>
    {% endif %}
  </td>

  <td style="padding:10px 8px;border-bottom:1px solid {{ RULE }};vertical-align:top;white-space:nowrap;
             font:400 12px/1.4 {{ FONT }};color:{{ INK2 }};font-variant-numeric:tabular-nums;">
    {{ row.age_days_display }}d old<br>
    <span style="color:{{ MUTED }};">idle {{ row.idle_days_display }}d</span>
  </td>

  <td style="padding:10px 8px;border-bottom:1px solid {{ RULE }};vertical-align:top;white-space:nowrap;
             font:600 12px/1.4 {{ FONT }};color:{{ INK }};">
    {{ row.ball_label }}
  </td>

  <td style="padding:10px 8px;border-bottom:1px solid {{ RULE }};vertical-align:top;">
    <div style="font:600 12px/1.4 {{ FONT }};color:{{ INK }};">{{ row.action_label }}</div>
    {% if row.suggested_target_group %}
    <div style="font:400 11px/1.4 {{ FONT }};color:{{ INK2 }};padding-top:2px;">
      to {{ row.suggested_target_group }}
    </div>
    {% endif %}
    {% if row.rationale %}
    <div style="font:400 11px/1.45 {{ FONT }};color:{{ INK2 }};padding-top:3px;">
      {{ row.rationale|truncate(150, true, '...') }}
    </div>
    {% endif %}
    <div style="font:400 10px/1.4 {{ FONT }};color:{{ MUTED }};padding-top:3px;">
      {% if row.low_confidence %}Needs your review &middot; {% endif %}confidence {{ row.confidence_pct }}%
      {%- set why = reasons.get(row.incident_number) %}
      {%- if why %} &middot; ranked for {{ why|join(', ') }}{% endif %}
    </div>
  </td>
</tr>
{%- endmacro -%}

<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:{{ PLANE }};">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:{{ PLANE }};">
<tr><td align="center" style="padding:20px 12px;">
<table role="presentation" width="720" cellpadding="0" cellspacing="0"
       style="width:720px;max-width:100%;background:{{ SURFACE }};border:1px solid {{ RULE }};border-radius:8px;">

  <!-- Header -->
  <tr><td style="padding:20px 20px 12px 20px;border-bottom:1px solid {{ RULE }};">
    <div style="font:600 18px/1.3 {{ FONT }};color:{{ INK }};">Aged pending ticket review</div>
    <div style="font:400 12px/1.5 {{ FONT }};color:{{ INK2 }};padding-top:4px;">
      {{ groups|join(', ') if groups else 'All groups' }}
      &middot; tickets open more than {{ aged_after_days }} days
      &middot; generated {{ generated_at.strftime('%a %d %b %Y, %H:%M') }}
    </div>
    {% if shadow_mode %}
    <div style="margin-top:10px;padding:7px 10px;background:{{ PLANE }};border-left:3px solid {{ WARNING }};
                font:400 11px/1.45 {{ FONT }};color:{{ INK2 }};">
      <strong style="color:{{ INK }};">Shadow mode.</strong>
      Recommendations are being recorded for accuracy measurement and are not yet
      part of the official process. Please review and mark whether you agree.
    </div>
    {% endif %}
  </td></tr>

  <!-- Stat tiles -->
  <tr><td style="padding:16px 14px 4px 20px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
      {{ stat_tile('Aged tickets', summary.total, 'in scope today', INK) }}
      {{ stat_tile('Waiting on us', summary.ours, 'the rest are blocked elsewhere', (CRITICAL if summary.ours else GOOD)) }}
      {{ stat_tile('SLA breached', summary.sla_breached, summary.sla_at_risk ~ ' more at risk', (CRITICAL if summary.sla_breached else GOOD)) }}
      {{ stat_tile('No action 4+ days', summary.critically_stale, 'needs a nudge', (SERIOUS if summary.critically_stale else GOOD)) }}
    </tr></table>
  </td></tr>

  <!-- What changed -->
  {% if movement.new_count or movement.worsening_count %}
  <tr><td style="padding:4px 20px 0 20px;">
    <div style="font:600 13px/1.4 {{ FONT }};color:{{ INK }};padding-bottom:6px;">Since yesterday</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
           style="background:{{ PLANE }};border:1px solid {{ RULE }};border-radius:6px;">
      <tr><td style="padding:10px 12px;font:400 12px/1.6 {{ FONT }};color:{{ INK2 }};">
        <strong style="color:{{ INK }};">{{ movement.new_count }} newly aged</strong>
        {% if movement.new %}&mdash;
          {% for row in movement.new[:6] %}<a href="{{ row.url }}"
             style="color:{{ ACCENT }};text-decoration:none;font-variant-numeric:tabular-nums;">{{ row.incident_number }}</a>{% if not loop.last %}, {% endif %}{% endfor %}
          {% if movement.new_count > 6 %} and {{ movement.new_count - 6 }} more{% endif %}
        {% endif %}
        <br>
        <strong style="color:{{ INK }};">{{ movement.worsening_count }} got worse</strong>
        {% if movement.worsening %}&mdash;
          {% for row in movement.worsening[:6] %}<a href="{{ row.url }}"
             style="color:{{ ACCENT }};text-decoration:none;font-variant-numeric:tabular-nums;">{{ row.incident_number }}</a>{% if not loop.last %}, {% endif %}{% endfor %}
          {% if movement.worsening_count > 6 %} and {{ movement.worsening_count - 6 }} more{% endif %}
        {% endif %}
      </td></tr>
    </table>
  </td></tr>
  {% endif %}

  <!-- Priority list -->
  <tr><td style="padding:18px 20px 0 20px;">
    <div style="font:600 13px/1.4 {{ FONT }};color:{{ INK }};">Ranked by attention score</div>
    <div style="font:400 11px/1.5 {{ FONT }};color:{{ MUTED }};padding:2px 0 8px 0;">
      Highest first. Working down from the top is the whole review on a normal day.
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
      <tr>
        {% for heading in ['Ticket', 'Summary', 'Age', 'Blocked by', 'Suggested next step'] %}
        <th align="left" style="padding:0 8px 6px 8px;border-bottom:1px solid {{ BORDER }};
                                font:600 11px/1.3 {{ FONT }};color:{{ MUTED }};
                                text-transform:uppercase;letter-spacing:.04em;">{{ heading }}</th>
        {% endfor %}
      </tr>
      {% for row in tickets %}{{ ticket_row(row, reasons) }}{% endfor %}
    </table>

    {% if truncated %}
    <div style="font:400 11px/1.5 {{ FONT }};color:{{ MUTED }};padding-top:8px;">
      {{ truncated }} further ticket{{ 's' if truncated != 1 }} below this threshold are not listed here.
      {% if base_url %}<a href="{{ base_url }}/board" style="color:{{ ACCENT }};">See the full board</a>.{% endif %}
    </div>
    {% endif %}
  </td></tr>

  <!-- Closure candidates -->
  {% if close_candidates %}
  <tr><td style="padding:18px 20px 0 20px;">
    <div style="font:600 13px/1.4 {{ FONT }};color:{{ INK }};">Closure candidates</div>
    <div style="font:400 11px/1.5 {{ FONT }};color:{{ MUTED }};padding:2px 0 8px 0;">
      Follow-ups documented, caller silent since. Approve in bulk on the board rather than one at a time.
    </div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
      {% for row in close_candidates %}
      <tr>
        <td style="padding:7px 8px;border-bottom:1px solid {{ RULE }};width:110px;
                   font:600 12px/1.3 {{ FONT }};font-variant-numeric:tabular-nums;">
          <a href="{{ row.url }}" style="color:{{ ACCENT }};text-decoration:none;">{{ row.incident_number }}</a>
        </td>
        <td style="padding:7px 8px;border-bottom:1px solid {{ RULE }};font:400 12px/1.4 {{ FONT }};color:{{ INK2 }};">
          {{ (row.short_description or '')|truncate(70, true, '...') }}
        </td>
        <td style="padding:7px 8px;border-bottom:1px solid {{ RULE }};white-space:nowrap;
                   font:400 11px/1.4 {{ FONT }};color:{{ MUTED }};font-variant-numeric:tabular-nums;">
          idle {{ row.idle_days_display }}d
        </td>
      </tr>
      {% endfor %}
    </table>
  </td></tr>
  {% endif %}

  <!-- Agent rollup -->
  {% if agents %}
  <tr><td style="padding:18px 20px 0 20px;">
    <div style="font:600 13px/1.4 {{ FONT }};color:{{ INK }};">By agent</div>
    <div style="font:400 11px/1.5 {{ FONT }};color:{{ MUTED }};padding:2px 0 8px 0;">
      Worst-first. The compliance column is the agent's 30-day average from the ticket audit tool.
    </div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
      <tr>
        {% for heading in ['Agent', 'Aged', 'Avg idle', 'Breached', 'Stale 4d+', 'Audit avg'] %}
        <th align="{{ 'left' if loop.first else 'right' }}"
            style="padding:0 8px 6px 8px;border-bottom:1px solid {{ BORDER }};
                   font:600 11px/1.3 {{ FONT }};color:{{ MUTED }};
                   text-transform:uppercase;letter-spacing:.04em;">{{ heading }}</th>
        {% endfor %}
      </tr>
      {% for entry in agents[:12] %}
      <tr>
        <td style="padding:7px 8px;border-bottom:1px solid {{ RULE }};font:400 12px/1.4 {{ FONT }};color:{{ INK }};">
          {{ entry.agent }}
        </td>
        {% for value in [entry.ticket_count, entry.avg_idle_days ~ 'd', entry.sla_breached, entry.critically_stale] %}
        <td align="right" style="padding:7px 8px;border-bottom:1px solid {{ RULE }};
                                 font:400 12px/1.4 {{ FONT }};color:{{ INK2 }};font-variant-numeric:tabular-nums;">
          {{ value }}
        </td>
        {% endfor %}
        <td align="right" style="padding:7px 8px;border-bottom:1px solid {{ RULE }};
                                 font:400 12px/1.4 {{ FONT }};font-variant-numeric:tabular-nums;
                                 color:{{ (CRITICAL if entry.compliance and entry.compliance.avg_score < 60 else INK2) }};">
          {% if entry.compliance %}{{ entry.compliance.avg_score }}%{% else %}&mdash;{% endif %}
        </td>
      </tr>
      {% endfor %}
    </table>
  </td></tr>
  {% endif %}

  <!-- Footer -->
  <tr><td style="padding:18px 20px 20px 20px;">
    {% if base_url %}
    <table role="presentation" cellpadding="0" cellspacing="0"><tr><td
        style="background:{{ ACCENT }};border-radius:5px;">
      <a href="{{ base_url }}/board"
         style="display:inline-block;padding:9px 18px;font:600 13px/1 {{ FONT }};
                color:#ffffff;text-decoration:none;">Open the review board</a>
    </td></tr></table>
    {% endif %}
    <div style="font:400 11px/1.6 {{ FONT }};color:{{ MUTED }};padding-top:14px;
                border-top:1px solid {{ RULE }};margin-top:14px;">
      Suggestions are advisory and were generated from ticket history, SLA state, past
      resolved incidents and knowledge articles. Nothing has been changed in ServiceNow.
      Marking whether you agree on the board is what tunes the accuracy.
    </div>
  </td></tr>

</table>
</td></tr>
</table>
</body>
</html>
